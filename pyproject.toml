[project]
name = "git-vault"
version = "0.1.0"
description = "Incremental encrypted git sync via append-only encrypted bundles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
git-vault = "git_vault.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["git_vault"]

[tool.hatch.build.targets.wheel.force-include]
"src/git_vault" = "git_vault"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
